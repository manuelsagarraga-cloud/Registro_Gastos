function parseDate(v,yearHint){
  if(v instanceof Date&&!isNaN(v))return iso(v.getFullYear(),v.getMonth()+1,v.getDate());
  if(typeof v==='number'&&v>30000&&v<80000){var dt=new Date(Math.round((v-25569)*86400000));return iso(dt.getUTCFullYear(),dt.getUTCMonth()+1,dt.getUTCDate())}
  var s=String(v==null?'':v).trim().toLowerCase();if(!s)return null;
  var m=s.match(/^(\d{4})-(\d{1,2})-(\d{1,2})/);if(m)return iso(+m[1],+m[2],+m[3]);
  m=s.match(/^(\d{1,2})[\/\-.](\d{1,2})[\/\-.](\d{2,4})/);if(m){var y=+m[3];if(y<100)y+=2000;return iso(y,+m[2],+m[1])}
  m=s.match(/^(\d{1,2})[\s\-\/.]([a-záé]{3})[a-z]*\.?[\s\-\/.]?(\d{2,4})?/);
  if(m&&MESES_A[m[2]]){var y2=m[3]?+m[3]:(yearHint||now.getFullYear());if(y2<100)y2+=2000;return iso(y2,MESES_A[m[2]],+m[1])}
  return null;
}
function parseNum(v){
  if(typeof v==='number')return v;
  var s=String(v==null?'':v).trim();if(!s)return null;
  var neg=false;
  if(/^\(.*\)$/.test(s)){neg=true;s=s.slice(1,-1)}
  if(/-\s*$/.test(s)){neg=true}
  if(/^[^\d(]*-/.test(s)){neg=true}
  s=s.replace(/[^\d.,]/g,'');if(!/\d/.test(s))return null;
  var lc=s.lastIndexOf(','),ld=s.lastIndexOf('.');
  if(lc>-1&&ld>-1){s=lc>ld?s.replace(/\./g,'').replace(',','.'):s.replace(/,/g,'')}
  else if(lc>-1){s=s.replace(/\./g,'').replace(',','.')}
  else if(ld>-1){var p=s.split('.');if(p.length>2||(p.length===2&&p[1].length===3))s=s.replace(/\./g,'')}
  var n=parseFloat(s);if(isNaN(n))return null;return neg?-n:n;
}
function parseCSV(t){
  var first=t.split(/\r?\n/).slice(0,6).join('\n');
  var cnt=function(c){return first.split(c).length-1};
  var delim=[';','\t',','].sort(function(a,b){return cnt(b)-cnt(a)})[0];
  var rows=[],row=[],cur='',q=false;
  for(var i=0;i<t.length;i++){var ch=t[i];
    if(q){if(ch==='"'){if(t[i+1]==='"'){cur+='"';i++}else q=false}else cur+=ch}
    else if(ch==='"')q=true;
    else if(ch===delim){row.push(cur);cur=''}
    else if(ch==='\n'||ch==='\r'){if(ch==='\r'&&t[i+1]==='\n')i++;row.push(cur);cur='';if(row.some(function(x){return x.trim()!==''}))rows.push(row);row=[]}
    else cur+=ch;
  }
  row.push(cur);if(row.some(function(x){return x.trim()!==''}))rows.push(row);
  return rows;
}

  var n=nk(full||desc),rules=cfg.rules;
  for(var i=0;i<rules.length;i++){if(ruleHit(n,rules[i].k))return rules[i].c}
  if(amt<0)return src==='cuenta'?'Ingresos':(/PAGO/.test(n)?'Pago de tarjeta':'General');
  return 'General';
}

var CU_RE=/\(cuota (\d{1,2})\/(\d{1,2})\)/i;
function myAmt(t){return t.sh!=null?t.amt*t.sh/100:t.amt}
function mshort(k){return MESES_L[+k.slice(5)-1].slice(0,3)+' '+k.slice(2,4)}
function mdiff(a,b){var x=a.split('-'),y=b.split('-');return (+x[0]-+y[0])*12+(+x[1]-+y[1])}
function curMonth(){return now.getFullYear()+'-'+String(now.getMonth()+1).padStart(2,'0')}

/* --- planes con aumentos (alquiler / ingresos) --- */
function planAmt(p,k){
  if(!p||!p.amt||!p.from||k<p.from)return null;
  if(p.over&&p.over[k]!=null)return p.over[k];
  var a=p.amt;
  (p.raises||[]).slice().sort(function(x,y){return x.m<y.m?-1:1}).forEach(function(r){if(r.m>p.from&&r.m<=k)a*=1+(r.pct||0)/100});
  return a;
}
function planRaise(p,k){
  if(!p||!p.from)return null;
  var r=(p.raises||[]).find(function(x){return x.m===k&&x.m>p.from});
  return r?{pct:r.pct||0}:null;
}
var FIJOS=[
 {key:'rentPlan',cat:'Alquiler',ref:'alquiler',label:'Alquiler e impuestos',kw:''},
 {key:'expTierralta',cat:'Expensas Tierralta',ref:'tierralta',label:'Expensas Tierralta',kw:'expensas'},
 {key:'servDepto',cat:'Servicios depto',ref:'servicios',label:'Servicios del departamento',kw:''}];
function payables(){return FIJOS.concat(SVC.map(function(x){return{key:x.key,cat:'Servicios',ref:'servicios',label:x.label,kw:x.kw,svc:true}}))}
function shareOf(key){if(key==='rentPlan')return 50;var p=cfg[key];return p&&p.share!=null?p.share:100}
function rentShare(){return shareOf('rentPlan')}
function rentOn(k){return planAmt(cfg.rentPlan,k)!=null}
function planHit(f,cat,desc){
  if(cat===f.cat)return true;
  var p=cfg[f.key],n=nk(desc||''),kws=((p&&p.kw)||'').split(',');
  for(var j=0;j<kws.length;j++){var w=nk(kws[j]);if(w&&n.indexOf(w)>=0)return true}
  return false;
}
function skipItem(k,cat,desc){
  for(var i=0;i<FIJOS.length;i++){if(planAmt(cfg[FIJOS[i].key],k)!=null&&planHit(FIJOS[i],cat,desc))return true}
  return false;
}
function fijoMine(key,k){var a=planAmt(cfg[key],k);return a==null?0:a*shareOf(key)/100}

/* --- datos por mes --- */
function isRec(key){return (cfg.recurring||[]).some(function(r){return r.key===key})}
function cardItems(k){
  return (months[k]||[]).filter(function(t){return t.src==='tarjeta'&&EXCL_NOSPEND.indexOf(t.cat)<0}).map(function(t){
    var m=t.desc.match(CU_RE),key=nk(t.desc.replace(CU_RE,''));
    return{t:t,mine:myAmt(t),n:m?+m[1]:0,of:m?+m[2]:0,key:key,rec:!m&&isRec(key)};
  });
}
function recAmt(key,upto){ /* tu parte del último cargo conocido de ese pago */
  var ks=Object.keys(months).filter(function(m){return m<=upto}).sort().reverse();
  for(var i=0;i<ks.length;i++){var f=cardItems(ks[i]).filter(function(x){return x.key===key&&!x.of&&x.t.amt>0});if(f.length)return f.reduce(function(a,x){return a+x.mine},0)}
  return 0;
}
function recSumProj(upto){return (cfg.recurring||[]).reduce(function(a,r){return a+recAmt(r.key,upto)},0)}
function cuentaRaw(k){
  return (months[k]||[]).filter(function(t){return t.src!=='tarjeta'&&EXCL_NOSPEND.indexOf(t.cat)<0&&!skipItem(k,t.cat,t.desc)}).map(function(t){return{t:t,mine:myAmt(t)}});
}
function cuentaItems(k){return cuentaRaw(k).filter(function(x){return cfg.sumGeneral||x.t.cat!=='General'})}
function cuentaGen(k){return sumM(cuentaRaw(k).filter(function(x){return x.t.cat==='General'}))}
function hogarDetail(k){
  if(!H.ready)return[];
  var out=[];
  (H.items[k]||[]).forEach(function(it){
    if(it.type==='pago'||EXCL_NOSPEND.indexOf(it.cat)>-1)return;
    if(skipItem(k,it.cat,it.desc))return;

    out.push({it:it,own:own,mine:own?it.amt*it.share/100:it.amt*(100-it.share)/100});
  });
  return out;
}
function sumM(l){return l.reduce(function(a,x){return a+x.mine},0)}
function lastWith(fn){
  var ks=Object.keys(months).filter(function(k){return months[k].length&&fn(k)}).sort();
  return ks.length?ks[ks.length-1]:null;
}
function lastMonths(){
  var LM=lastWith(function(k){return cardItems(k).length}),
      LC=lastWith(function(k){return months[k].some(function(t){return t.src!=='tarjeta'})}),
      LH=null;
  if(H.ready){var hk=Object.keys(H.items).filter(function(k){return H.items[k].length}).sort();LH=hk.length?hk[hk.length-1]:null}
  return{LM:LM,LC:LC,LH:LH};
}
function avgOf(fn,last,n,skipCur){
  if(!last)return 0;
  if(skipCur&&last===curMonth())last=shiftMonth(last,-1);
  var a=0;for(var i=0;i<n;i++)a+=fn(shiftMonth(last,-i));
  return a/n;
}
function monthSummary(k){
  var L=lastMonths(),proj={},o={k:k};
  /* tarjetas */
  if(L.LM&&k>L.LM){
    var off=mdiff(k,L.LM),cu=0;
    cardItems(L.LM).forEach(function(x){if(x.of&&x.n<x.of&&off<=x.of-x.n)cu+=x.mine});
    o.cardCu=cu;
    o.recM=recSumProj(L.LM);
    o.cardCorr=avgOf(function(m){return sumM(cardItems(m).filter(function(x){return !x.of&&!x.rec}))},L.LM,3)+o.recM;
    proj.card=1;
  }else{
    var ci=cardItems(k);
    o.cardCu=sumM(ci.filter(function(x){return x.of}));
    o.cardPaid=ci.reduce(function(a,x){return a+x.t.amt},0);
    o.cardCorr=sumM(ci.filter(function(x){return !x.of}));
    o.recM=sumM(ci.filter(function(x){return x.rec}));
  }
  o.card=o.cardCu+o.cardCorr;
  /* cuenta */
  if(L.LC&&k>L.LC){o.cuenta=avgOf(function(m){return sumM(cuentaItems(m))},L.LC,3,true);proj.cuenta=1}
  else o.cuenta=sumM(cuentaItems(k));
  /* vida diaria */

function hogarBalParts(k){
  var r={vida:0,card:0,fijos:0};
  Object.keys(H.items).forEach(function(m){
    if(k&&m!==k)return;
    H.items[m].forEach(function(it){
      if(it.type==='pago'){r.vida+=it.payer===H.uid?it.amt:-it.amt;return}
      var g=(it.ref==='alquiler'||it.ref==='tierralta'||it.ref==='servicios')?'fijos':(it.ref&&it.ref!=='splitwise')?'card':'vida',oth=it.amt*(100-it.share)/100;
      r[g]+=it.payer===H.uid?oth:-oth;
    });
  });
  r.n=r.vida+r.card+r.fijos;return r;
}

/* ---------- AHORRO ---------- */
function entCur(a){return a.cur||'USD'}
function entAmt(a){return a.amt!=null?a.amt:a.usd}
function entEq(a){return entCur(a)==='ARS'?((cfg.fx||0)?entAmt(a)/cfg.fx:0):entAmt(a)}
function entSum(fn,eq,cur){return (cfg.ahorro||[]).filter(fn).filter(function(a){return !cur||entCur(a)===cur}).reduce(function(s,a){return s+(eq?entEq(a):entAmt(a))},0)}
function savOf(k,tipo){return entSum(function(a){return a.m===k&&a.tipo===tipo&&!a.init},true)}
function savRaw(k,tipo,cur){return entSum(function(a){return a.m===k&&a.tipo===tipo&&!a.init},false,cur)}
function balRaw(cur,uptoYear){return entSum(function(a){return a.tipo==='ahorro'&&(uptoYear==null||a.m.slice(0,4)<uptoYear)},false,cur)-entSum(function(a){return a.tipo==='uso'&&(uptoYear==null||a.m.slice(0,4)<uptoYear)},false,cur)}
function mixTxt(u,a){var o=[];if(u)o.push(usd(u));if(a)o.push(money(a));return o.length?o.join('<br>'):'—'}
function goalOf(y){
  y=String(y);
  if(cfg.goals&&cfg.goals[y]&&cfg.goals[y].usd!=null)return cfg.goals[y].usd;
  return y===String(now.getFullYear())?(cfg.goalUSD||0):0;
}
function planExp(y,m){var g=cfg.goals&&cfg.goals[y];return g&&g.plan&&g.plan[m]!=null?g.plan[m]:null}
function planOf(y,m){
  var x=planExp(y,m);if(x!=null)return x;
  var g=goalOf(y);if(!g)return 0;
  var ex=0,u=0;for(var i=1;i<=12;i++){var mm=y+'-'+String(i).padStart(2,'0'),e2=planExp(y,mm);if(e2!=null)ex+=e2;else u++}
  return u?Math.max(0,g-ex)/u:0;
}
function G(y){y=String(y);if(!cfg.goals)cfg.goals={};if(!cfg.goals[y])cfg.goals[y]={usd:goalOf(y),plan:{}};if(!cfg.goals[y].plan)cfg.goals[y].plan={};return cfg.goals[y]}
function yearSaved(y,tipo){return entSum(function(a){return a.tipo===tipo&&!a.init&&a.m.slice(0,4)===String(y)},true)}
function yearRawARS(y,tipo){return entSum(function(a){return a.tipo===tipo&&!a.init&&a.m.slice(0,4)===String(y)},false,'ARS')}
function vAhorro(){

  h+='<div class="kpis">'+

   '<div class="kpi"><div class="l">Gastado del ahorro en '+yr+'</div><div class="v">'+usd(yU)+'</div><div class="s">Neto del año: '+usd(yS-yU)+'</div></div>'+
   '<div class="kpi"><div class="l">Ahorro disponible hoy</div><div class="v '+(avEq>=0?'good':'badc')+'">'+(fx?money(avU*fx+avA):usd(avU))+'</div><div class="s">'+(fx?usd(avU)+' + '+money(avA)+' ≈ '+usd(avEq):(avA?'+ '+money(avA)+' en pesos · poné el dólar para sumarlos':'Todos los años'))+'</div></div></div>';

     '<td class="n '+(past&&r.pl?(df>=0?'good':'badc'):'note')+'">'+(past&&r.pl?(df>=0?'+':'')+usd(df):'—')+'</td>'+
     '<td class="n"><b>'+(r.bU||r.bA?mixTxt(r.bU,r.bA):usd(0))+'</b>'+(fx&&r.bA?'<div class="note">≈ '+usd(r.bU+r.bA/fx)+'</div>':'')+'</td><td class="n note">'+usd(r.pb)+'</td></tr>'}).join('')+'</table></div><p class="note">Dejá el casillero vacío para usar el reparto parejo. Poné un valor para marcar meses de más (aguinaldo, un ingreso extra) o de menos. «Acumulado» es todo lo ahorrado menos lo gastado, incluyendo años anteriores y el saldo inicial. Lo ahorrado en pesos se convierte al dólar de referencia para compararlo con el plan (en USD).</p></div>';
  h+='<div class="card"><h2>Anotar</h2><div class="grid2"><div><h3 style="margin-top:0">Ahorré</h3><div class="row"><input type="month" id="sm" value="'+(ui.month.slice(0,4)===yr?ui.month:yr+'-01')+'"><input id="su" inputmode="decimal" placeholder="Importe" size="10"><select id="sc"><option>USD</option><option value="ARS">Pesos</option></select><input id="sn" placeholder="Nota (ej. compra de dólares)"><button class="pri" id="sadd">Registrar</button></div><label class="note"><input type="checkbox" id="sinit"> Ya lo tenía guardado (saldo inicial: suma al disponible, no al objetivo del año)</label></div>'+

  var list=A.filter(function(a){return a.m.slice(0,4)===yr}).sort(function(a,b){return a.m<b.m?1:a.m>b.m?-1:0});

function svcLast(sv){
  var kws=sv.kw.split(',').map(nk).filter(Boolean),ex=sv.ex?nk(sv.ex):'',best=null;
  function hit(desc){var n=nk(desc||'');if(ex&&n.indexOf(ex)>=0)return false;return kws.some(function(w){return n.indexOf(w)>=0})}
  function take(d,amt,desc){if(!amt||amt<=0)return;if(!best||d>best.d)best={d:d,amt:amt,desc:desc}}
  Object.keys(months).forEach(function(m){(months[m]||[]).forEach(function(t){if(t.amt>0&&hit(t.desc))take(t.od||t.d||m+'-01',t.amt,t.desc)})});
  if(H.ready)Object.keys(H.items).forEach(function(m){(H.items[m]||[]).forEach(function(it){if(it.type!=='pago'&&hit(it.desc))take(it.d||m+'-01',it.amt,it.desc)})});

/* Plan compartido: monto, vigencia y aumentos de alquiler/expensas/servicios son del hogar (los ven y editan los dos).

function planCore(p){var o={amt:p.amt||0,from:p.from||'',raises:p.raises||[]};if(p.over&&Object.keys(p.over).length)o.over=p.over;return o}
function planSync(){
  var dirty=false,push=false;
  SHARED.forEach(function(key){
    var sp=H.plan[key],lp=cfg[key],fj=FIJOS.find(function(x){return x.key===key})||SVC.find(function(x){return x.key===key});
    if(sp&&sp.amt){
      if(!lp)lp=cfg[key]={share:key==='rentPlan'?undefined:50,kw:fj?fj.kw:undefined};
      var a=JSON.stringify(planCore(lp)),b=JSON.stringify(planCore(sp));
      if(a!==b){lp.amt=sp.amt;lp.from=sp.from;lp.raises=sp.raises||[];if(sp.over)lp.over=sp.over;else delete lp.over;dirty=true}
    }else if(lp&&lp.amt>0){H.plan[key]=planCore(lp);push=true}
  });
  if(dirty)save('cfg');
  if(push)planPush();
}
function planPush(key){
  if(!H.ready||!H.planOK)return;
  if(key&&cfg[key])H.plan[key]=planCore(cfg[key]);
  q=q.then(async function(){
    var cur=await sb.from('hogar_plan').select('data').eq('hogar_id',H.hid).maybeSingle();

    SHARED.forEach(function(k){if(H.plan[k])mine[k]=H.plan[k]});
    var upd={};if(key){upd[key]=mine[key]}else{upd=mine}

}

      if(ro.error){
        oth.forEach(function(x){var i=arr.indexOf(x.it);if(i>-1)arr.splice(i,1)});
        setBadge('Guardado ✓');toast('No se guardó lo de '+fname()+': falta el permiso en la base (SQL de «quién pagó»). Lo tuyo sí se guardó.');
        if(ui.tab==='hogar')vHogar();return;
      }
      oth.forEach(function(x){H.synced[x.key]={k:k,j:x.j}});
    }
    if(del.length){
      var by={};del.forEach(function(key){var i=key.indexOf('|');(by[key.slice(0,i)]=by[key.slice(0,i)]||[]).push(key.slice(i+1))});
      var pk=Object.keys(by);
      for(var n=0;n<pk.length;n++){
        var r2=await sb.from('hogar_items').delete().eq('hogar_id',H.hid).eq('payer',pk[n]).in('id',by[pk[n]]).select('id');
        if(r2.error)throw r2.error;
        if(pk[n]!==H.uid&&(!r2.data||!r2.data.length))toast('No pude borrar lo de '+fname()+': falta el permiso en la base');
      }
      del.forEach(function(key){delete H.synced[key]});
    }
    setBadge('Guardado ✓');
  }catch(err){setBadge('Error al guardar');toast('No pude guardar en el hogar: '+(err&&err.message?err.message:'error'))}
}
function hogarUpsert(item,payer){
  var k=item.d.slice(0,7);item.payer=payer||H.uid;
  var arr=H.items[k]||(H.items[k]=[]);
  var idx=arr.findIndex(function(x){return x.id===item.id&&x.payer===item.payer});
  if(idx>-1)arr[idx]=item;else arr.push(item);
  arr.sort(function(a,b){return a.d<b.d?-1:a.d>b.d?1:0});
  hogarSave(k);
}
function hogarRemove(id,payer){
  payer=payer||H.uid;
  Object.keys(H.items).forEach(function(k){
    var arr=H.items[k],i=arr.findIndex(function(x){return x.id===id&&x.payer===payer});
    if(i>-1){arr.splice(i,1);hogarSave(k)}
  });
}
function hogarFromTx(t){
  if(!H.ready||t.sh==null)return;
  if(t.sh>=100){hogarRemove('p-'+t.id);return}
  if(t.src==='tarjeta'&&!(cfg.cardPaid&&cfg.cardPaid[t.d.slice(0,7)])){hogarRemove('p-'+t.id);return}
  hogarUpsert({id:'p-'+t.id,d:t.d,desc:t.desc,amt:t.amt,cat:t.cat,note:t.note||'',share:t.sh,type:'gasto',ref:t.id});
}
function hogarExtras(k){
  if(!H.ready)return[];
  var out=[];
  (H.items[k]||[]).forEach(function(it){
    if(it.type==='pago'||EXCL_NOSPEND.indexOf(it.cat)>-1)return;
    if(it.payer===H.uid){if(!it.ref)out.push({cat:it.cat||'General',amt:it.amt*it.share/100})}
    else out.push({cat:it.cat||'General',amt:it.amt*(100-it.share)/100});
  });
  return out;
}
function hogarBal(k){
  var b={n:0,paidMe:0,paidO:0,consMe:0,consO:0,total:0};
  Object.keys(H.items).forEach(function(m){
    if(k&&m!==k)return;
    H.items[m].forEach(function(it){
      if(it.type==='pago'){if(it.payer===H.uid)b.n+=it.amt;else b.n-=it.amt;return}
      var oth=it.amt*(100-it.share)/100,own=it.amt*it.share/100;
      b.total+=it.amt;
      if(it.payer===H.uid){b.n+=oth;b.paidMe+=it.amt;b.consMe+=own;b.consO+=oth}
      else{b.n-=oth;b.paidO+=it.amt;b.consO+=own;b.consMe+=oth}
    });
  });
  return b;
}
function balHtml(n,on){
  if(n>0.5)return'<span class="big good">'+e(on)+' te debe '+money(n)+'</span><div class="note">Para igualarse, '+e(on)+' tiene que transferirte '+money(n)+'.</div>';
  if(n<-0.5)return'<span class="big badc">Le debés '+money(-n)+' a '+e(on)+'</span><div class="note">Para igualarse tenés que transferirle '+money(-n)+' a '+e(on)+'.</div>';
  return'<span class="big">Están a mano</span>';
}
async function hogarImport(file){
  var d=JSON.parse(await file.text());
  if(!d||d.kind!=='hogar-historial'||!Array.isArray(d.items))throw new Error('Ese archivo no es un historial de hogar');
  var n=0,ks={};
  d.items.forEach(function(x){
    if(!x.id||!/^\d{4}-\d{2}-\d{2}$/.test(x.d||'')||typeof x.amt!=='number')return;
    var it={id:String(x.id),d:x.d,desc:String(x.desc||''),amt:x.amt,share:x.share==null?50:x.share,type:x.type==='pago'?'pago':'gasto',payer:H.uid};
    if(x.cat)it.cat=x.cat;if(x.note)it.note=x.note;if(x.ref)it.ref=x.ref;
    var k=it.d.slice(0,7),arr=H.items[k]||(H.items[k]=[]);
    var i=arr.findIndex(function(y){return y.id===it.id&&y.payer===H.uid});
    if(i>-1)arr[i]=it;else arr.push(it);
    ks[k]=1;n++;
  });
  Object.keys(ks).forEach(function(k){H.items[k].sort(function(a,b){return a.d<b.d?-1:a.d>b.d?1:0});hogarSave(k)});
  return n;
}
function vHogar(){
  var v=$('#view');
  if(!H.ready){
    v.innerHTML='<div class="card"><h2>Gastos en pareja</h2>'+
     '<p>Cada uno carga lo que pagó, marca qué gastos son compartidos y la app calcula cuánto tiene que aportar el otro para igualarse.</p>'+
     '<p class="note">Tus movimientos personales no se comparten. Solo se ve lo que marques como «Compartido». Un hogar es de dos personas.</p>'+
     '<div class="grid2"><div class="card"><h3 style="margin-top:0">Creo yo el hogar</h3><label class="f">Tu nombre en el hogar<input id="hname1" placeholder="ej. Manuel"></label><div class="row" style="margin-top:10px"><button class="pri" id="hcreate">Crear hogar</button></div><p class="note">Te va a dar un código para pasarle a la otra persona.</p></div>'+
     '<div class="card"><h3 style="margin-top:0">Mi pareja ya lo creó</h3><label class="f">Tu nombre en el hogar<input id="hname2" placeholder="ej. Flor"></label><label class="f" style="margin-top:8px">Código del hogar<input id="hcode" autocomplete="off"></label><div class="row" style="margin-top:10px"><button id="hjoin">Unirme</button></div></div></div><p class="note" id="herr"></p></div>';
    $('#hcreate').addEventListener('click',async function(){
      var n=$('#hname1').value.trim();if(!n){$('#herr').textContent='Poné tu nombre.';return}
      $('#herr').textContent='Creando…';
      var r=await sb.rpc('crear_hogar',{p_nombre:n});
      if(r.error){$('#herr').textContent=r.error.message;return}
      try{await hogarLoad()}catch(err){$('#herr').textContent=err.message;return}
      toast('Hogar creado');render();
    });
    $('#hjoin').addEventListener('click',async function(){
      var n=$('#hname2').value.trim(),c=$('#hcode').value.trim();if(!n||!c){$('#herr').textContent='Poné tu nombre y el código.';return}
      $('#herr').textContent='Entrando…';
      var r=await sb.rpc('unirse_hogar',{p_codigo:c,p_nombre:n});
      if(r.error){$('#herr').textContent=r.error.message;return}
      try{await hogarLoad()}catch(err){$('#herr').textContent=err.message;return}
      toast('Ya estás en el hogar');render();
    });
    return;
  }
  if(Date.now()-H.t>20000){H.t=Date.now();hogarLoad().then(function(){if(ui.tab==='hogar')vHogar()}).catch(function(){})}
  var o=hogarOther(),on=o?H.members[o]:'La otra persona',tot=hogarBal(null),mb=hogarBal(ui.month);
  var h='<div class="card"><div class="row"><h2 style="margin:0;flex:1">Hogar: '+e(myName())+(o?' y '+e(on):'')+'</h2><button id="hrefresh">Actualizar</button></div>'+
   '<div class="row" style="margin-top:8px"><label class="note">Tu nombre en el hogar</label><input id="hname" size="14" value="'+e(myName())+'"><button id="hnamesave">Cambiar</button></div>'+
   (o?'':'<p class="alert">Todavía no entró la otra persona. Que cree su cuenta en esta misma página y elija «Unirme» con este código: <b>'+e(H.code)+'</b></p>')+
   '<h3>Saldo acumulado entre ustedes</h3>'+balHtml(tot.n,on)+
   '<div class="row" style="margin-top:10px"><span class="note">Registrar un pago entre ustedes:</span><select id="gdir"><option value="me">Yo le pagué a '+e(on)+'</option><option value="other">'+e(on)+' me pagó a mí</option></select><input id="gamt" inputmode="decimal" placeholder="Importe" size="10"><input id="gdate" type="date" value="'+new Date().toISOString().slice(0,10)+'"><button id="gadd"'+(o?'':' disabled')+'>Registrar pago</button></div></div>';
  h+='<div class="card"><h2>'+e(mlabel(ui.month))+'</h2><table class="calc">'+
   '<tr><td>Gastado en conjunto</td><td class="n">'+money(mb.total)+'</td></tr>'+
   '<tr><td>Pagó '+e(myName())+'</td><td class="n">'+money(mb.paidMe)+'</td></tr>'+
   '<tr><td>Pagó '+e(on)+'</td><td class="n">'+money(mb.paidO)+'</td></tr>'+
   '<tr><td>Le corresponde a '+e(myName())+' / a '+e(on)+'</td><td class="n">'+money(mb.consMe)+' / '+money(mb.consO)+'</td></tr>'+
   '<tr class="t"><td>Diferencia solo de este mes</td><td class="n">'+(Math.abs(mb.n)<0.5?'a mano':(mb.n>0?e(on)+' debe '+money(mb.n):'debés '+money(-mb.n))+' (sin contar pagos de meses anteriores)')+'</td></tr></table></div>';
  var list=(H.items[ui.month]||[]).slice().sort(function(a,b){return a.d<b.d?-1:a.d>b.d?1:0});
  h+='<div class="card"><h2>Movimientos del hogar</h2>';
  if(!list.length)h+='<p class="note">Nada cargado este mes. Marcá movimientos como «Compartido» en la pestaña Movimientos, o agregá uno acá abajo.</p>';
  else h+='<table><tr><th>Fecha</th><th>Detalle</th><th>Pagó</th><th class="n">Total</th><th>Reparto</th><th></th></tr>'+list.map(function(it){
    var own=it.payer===H.uid,oth=own?o:H.uid;
    if(it.type==='pago')return'<tr><td>'+e(it.d.slice(8)+'/'+it.d.slice(5,7))+'</td><td>'+e(it.desc)+'<span class="chip">pago</span></td><td>'+e(nameOf(it.payer))+'</td><td class="n">'+money(it.amt)+'</td><td></td><td>'+(o?'<button class="x hdel" data-id="'+e(it.id)+'" data-payer="'+e(it.payer)+'">×</button>':'')+'</td></tr>';
    return'<tr data-id="'+e(it.id)+'"><td>'+e(it.d.slice(8)+'/'+it.d.slice(5,7))+'</td><td>'+e(it.desc)+'<span class="chip">'+e(it.cat||'General')+'</span>'+(it.note?'<div class="note">'+e(it.note)+'</div>':'')+'</td><td>'+e(nameOf(it.payer))+'</td><td class="n">'+money(it.amt)+'</td>'+
     '<td class="note">'+(own?'<input class="hsh" size="3" value="'+it.share+'">% mío':e(nameOf(it.payer))+' '+it.share+'% · '+e(nameOf(oth))+' '+(100-it.share)+'%')+'</td><td>'+(o?'<button class="x hdel" data-id="'+e(it.id)+'" data-payer="'+e(it.payer)+'">×</button>':'')+'</td></tr>';
  }).join('')+'</table>';
  h+='<p class="note">Podés borrar cualquier movimiento (también los que figuran pagados por '+e(on)+', si ya corriste el SQL de permisos). El % solo se edita en lo que pagaste vos.</p></div>';
  h+='<div class="card"><h2>Dejar el saldo en un valor</h2><div class="row"><span class="note">Saldo que tiene que dar hoy (positivo = '+e(on)+' te debe, negativo = le debés):</span><input id="stgt" inputmode="decimal" placeholder="ej. 27000" size="10"><button id="sfix"'+(o?'':' disabled')+'>Ajustar</button></div><p class="note">Hoy da '+(tot.n>=0?'+':'−')+money(Math.abs(tot.n))+'. El ajuste agrega un pago de «Ajuste de saldo» por la diferencia, para arrancar desde ahí. Podés borrarlo con la ×.</p></div>';
  h+='<div class="card"><h2>Agregar un gasto compartido</h2><div class="row"><select id="hpay"><option value="me">Pagué yo</option><option value="other">Pagó '+e(on)+'</option></select><input id="hdt" type="date" value="'+ui.month+'-01"><input id="hds" placeholder="Descripción"><input id="hmt" inputmode="decimal" placeholder="Total pagado" size="10"><select id="hct">'+cfg.cats.filter(function(c){return EXCL_NOSPEND.indexOf(c)<0}).map(function(c){return'<option>'+e(c)+'</option>'}).join('')+'</select><label class="note">mi parte <input id="hpc" size="3" value="50">%</label><button id="hadd" class="pri">Agregar</button></div><p class="note">«Mi parte» es lo que te toca a vos, aunque lo haya pagado '+e(on)+'. Con 50% se reparte a mitades; con 0% fue todo del otro.</p></div>';
  h+='<div class="card"><h2>Importar historial</h2><p class="note">Cargá un archivo de historial (.json) con lo que pagaste vos. Se puede repetir sin duplicar. Cada uno importa el suyo.</p><div class="row"><input type="file" id="himp" accept=".json"></div></div>';
  v.innerHTML=h;
  $('#himp').addEventListener('change',function(){
    var f=this.files[0];if(!f)return;
    hogarImport(f).then(function(n){toast(n+' movimientos importados. Guardando…');vHogar()}).catch(function(err){toast(err&&err.message?err.message:'No pude leer el archivo')});
  });
  $('#hnamesave').addEventListener('click',function(){
    var nn=$('#hname').value.trim();if(!nn){toast('Poné un nombre');return}
    cfg.myName=nn;save('cfg');
    sb.from('hogar_miembros').update({nombre:nn}).eq('hogar_id',H.hid).eq('user_id',S.uid).select().then(function(r){
      if(!r.error&&r.data&&r.data.length){H.members[S.uid]=nn;toast('Listo: lo ve también '+fname())}else toast('Listo en tu pantalla. Para que '+fname()+' también lo vea hace falta un permiso en la base')
      vHogar()})});
  $('#hrefresh').addEventListener('click',function(){hogarLoad().then(function(){toast('Actualizado');vHogar()}).catch(function(){toast('No pude actualizar')})});
  $('#gadd').addEventListener('click',function(){
    var a=parseNum($('#gamt').value),d=$('#gdate').value;if(!a||a<=0||!d||!o){toast('Poné un importe y una fecha');return}
    var fr=$('#gdir').value==='other';
    hogarUpsert({id:'g-'+uid(),d:d,desc:fr?'Pago de '+on+' a '+myName():'Pago de '+myName()+' a '+on,amt:a,share:50,type:'pago'},fr?o:H.uid);toast('Pago registrado');ui.month=d.slice(0,7);vHogar();
  });
  $('#hadd').addEventListener('click',function(){
    var d=$('#hdt').value,ds=$('#hds').value.trim(),a=parseNum($('#hmt').value),pc=parseNum($('#hpc').value);
    if(!d||!ds||!a||a<=0||pc==null||pc<0||pc>100){toast('Revisá fecha, descripción, importe y porcentaje (0 a 100)');return}
    var po=$('#hpay').value==='other';
    if(po&&!o){toast('Todavía no entró la otra persona al hogar');return}
    hogarUpsert({id:'h-'+uid(),d:d,desc:ds,amt:a,cat:$('#hct').value,share:po?100-pc:pc,type:'gasto'},po?o:H.uid);ui.month=d.slice(0,7);vHogar();
  });
  $('#sfix').addEventListener('click',function(){
    var tg=parseNum($('#stgt').value);if(tg==null||isNaN(tg)||!o){toast('Poné el saldo que tiene que dar');return}
    var df=Math.round((tg-tot.n)*100)/100;if(Math.abs(df)<1){toast('Ya da ese saldo');return}
    hogarUpsert({id:'adj-'+uid(),d:new Date().toISOString().slice(0,10),desc:'Ajuste de saldo (dejarlo en '+money(tg)+')',amt:Math.abs(df),share:50,type:'pago'},df>0?H.uid:o);
    toast('Ajuste de '+money(Math.abs(df))+' agregado');vHogar()});
  v.querySelectorAll('.hdel').forEach(function(b){b.addEventListener('click',function(){hogarRemove(b.dataset.id,b.dataset.payer||H.uid);vHogar()})});
  v.querySelectorAll('.hsh').forEach(function(i){i.addEventListener('change',function(){
    var id=i.closest('tr').dataset.id,pc=parseNum(i.value);
    if(pc==null||pc<0||pc>100){toast('El porcentaje va de 0 a 100');return}
    var arr=H.items[ui.month]||[],it=arr.find(function(x){return x.id===id&&x.payer===H.uid});
    if(it){it.share=pc;hogarSave(ui.month);if(it.ref){var tt=(months[ui.month]||[]).find(function(x){return x.id===it.ref});if(tt){tt.sh=pc;save(ui.month)}}vHogar()}
  })});
}

qaInit();
boot();
})();
