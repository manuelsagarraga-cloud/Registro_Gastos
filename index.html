    var r=await sb.from('movimientos').select('*').eq('user_id',S.uid).order('fecha',{ascending:true}).range(from,from+999);
    if(r.error)throw r.error;
    r.data.forEach(function(row){var t=fromRow(row),k=t.d.slice(0,7);(months[k]=months[k]||[]).push(t);synced[t.id]={k:k,j:JSON.stringify(toRow(t))}});

function download(name,text,type){
  var a=document.createElement('a');a.href=URL.createObjectURL(new Blob([text],{type:type}));a.download=name;
  document.body.appendChild(a);a.click();a.remove();
}
function exportBackup(){

}
function exportCSV(){
  var rows=[['fecha','fecha_compra','descripcion','importe','fuente','categoria','nota','mi_parte_pct']];
  cfg.months.forEach(function(k){(months[k]||[]).forEach(function(t){rows.push([t.d,t.od||'',t.desc,String(t.amt).replace('.',','),t.src,t.cat,t.note||'',t.sh==null?'':t.sh])})});
  var csv=rows.map(function(r){return r.map(function(c){c=String(c);return /[;"\n]/.test(c)?'"'+c.replace(/"/g,'""')+'"':c}).join(';')}).join('\n');
  download('gastos-'+new Date().toISOString().slice(0,10)+'.csv','﻿'+csv,'text/csv');
}
function importBackup(txt){
  var d=JSON.parse(txt);if(!d.cfg||!d.months)throw new Error('Ese archivo no es un respaldo válido');
  cfg=Object.assign(defaultCfg(),d.cfg);var n=0;
  Object.keys(d.months).forEach(function(k){
    months[k]=months[k]||[];
    d.months[k].forEach(function(t){if(!months[k].some(function(x){return x.id===t.id})){months[k].push(t);n++}});
    months[k].sort(function(a,b){return a.d<b.d?-1:a.d>b.d?1:0});
  });
  cfg.months=Object.keys(months).sort();
  save('cfg');Object.keys(d.months).forEach(function(k){save(k)});
  return n;
}

/* ---------- cálculos ---------- */
function stats(k){
  var by={},inc=0,sav=0,gn=0,gs=0,cnt=0;
  (months[k]||[]).forEach(function(t){
    var a=t.sh!=null?t.amt*t.sh/100:t.amt;
    if(t.cat==='Ingresos'){inc+=-t.amt;return}
    if(t.cat==='Pago de tarjeta'||t.cat==='Movimiento interno')return;
    if(t.cat==='Ahorro'){sav+=a;return}
    by[t.cat]=(by[t.cat]||0)+a;cnt++;
    if(t.cat==='General'){gn++;gs+=a}
  });
  hogarExtras(k).forEach(function(x){by[x.cat]=(by[x.cat]||0)+x.amt;cnt++});
  var rentTx=by['Alquiler']||0,variable=0;
  Object.keys(by).forEach(function(c){if(c!=='Alquiler')variable+=by[c]});
  return{by:by,inc:inc,sav:sav,gn:gn,gs:gs,rentTx:rentTx,variable:variable,spend:variable+rentTx,cnt:cnt};
}

}

/* ================= VISTAS MENSUALES ================= */
var CU_RE=/\(cuota (\d{1,2})\/(\d{1,2})\)/i;
function myAmt(t){return t.sh!=null?t.amt*t.sh/100:t.amt}
function mshort(k){return MESES_L[+k.slice(5)-1].slice(0,3)+' '+k.slice(2,4)}
function mdiff(a,b){var x=a.split('-'),y=b.split('-');return (+x[0]-+y[0])*12+(+x[1]-+y[1])}
function curMonth(){return now.getFullYear()+'-'+String(now.getMonth()+1).padStart(2,'0')}
function plannedFor(k){return cfg.planned.filter(function(p){return p.month===null||p.month===k})}

/* --- planes con aumentos (alquiler / ingresos) --- */
function planAmt(p,k){
  if(!p||!p.amt||!p.from||k<p.from)return null;
  var a=p.amt;
  (p.raises||[]).slice().sort(function(x,y){return x.m<y.m?-1:1}).forEach(function(r){if(r.m>p.from&&r.m<=k)a*=1+(r.pct||0)/100});
  return a;
}
function planRaise(p,k){
  if(!p||!p.from)return null;
  var r=(p.raises||[]).find(function(x){return x.m===k&&x.m>p.from});
  return r?{pct:r.pct||0}:null;
}
function rentShare(){var p=cfg.rentPlan;return p&&p.share!=null?p.share:100}
function rentOn(k){return planAmt(cfg.rentPlan,k)!=null}

/* --- datos por mes --- */
function cardItems(k){
  return (months[k]||[]).filter(function(t){return t.src==='tarjeta'&&EXCL_NOSPEND.indexOf(t.cat)<0}).map(function(t){
    var m=t.desc.match(CU_RE);
    return{t:t,mine:myAmt(t),n:m?+m[1]:0,of:m?+m[2]:0,key:nk(t.desc.replace(CU_RE,''))};
  });
}
function cuentaRaw(k){
  var skipRent=rentOn(k);
  return (months[k]||[]).filter(function(t){return t.src!=='tarjeta'&&EXCL_NOSPEND.indexOf(t.cat)<0&&!(skipRent&&t.cat==='Alquiler')}).map(function(t){return{t:t,mine:myAmt(t)}});
}
function cuentaItems(k){return cuentaRaw(k).filter(function(x){return cfg.sumGeneral||x.t.cat!=='General'})}
function cuentaGen(k){return sumM(cuentaRaw(k).filter(function(x){return x.t.cat==='General'}))}
function hogarDetail(k){
  if(!H.ready)return[];
  var skipRent=rentOn(k),out=[];
  (H.items[k]||[]).forEach(function(it){
    if(it.type==='pago'||EXCL_NOSPEND.indexOf(it.cat)>-1)return;
    if(skipRent&&it.cat==='Alquiler')return;
    var own=it.payer===H.uid;
    if(own&&it.ref&&it.ref!=='splitwise')return; /* ya cuenta en tarjeta/cuenta */
    out.push({it:it,own:own,mine:own?it.amt*it.share/100:it.amt*(100-it.share)/100});
  });
  return out;
}
function sumM(l){return l.reduce(function(a,x){return a+x.mine},0)}
function lastWith(fn){
  var ks=Object.keys(months).filter(function(k){return months[k].length&&fn(k)}).sort();
  return ks.length?ks[ks.length-1]:null;
}
function lastMonths(){
  var LM=lastWith(function(k){return cardItems(k).length}),
      LC=lastWith(function(k){return months[k].some(function(t){return t.src!=='tarjeta'})}),
      LH=null;
  if(H.ready){var hk=Object.keys(H.items).filter(function(k){return H.items[k].length}).sort();LH=hk.length?hk[hk.length-1]:null}
  return{LM:LM,LC:LC,LH:LH};
}
function avgOf(fn,last,n,skipCur){
  if(!last)return 0;
  if(skipCur&&last===curMonth())last=shiftMonth(last,-1);
  var a=0;for(var i=0;i<n;i++)a+=fn(shiftMonth(last,-i));
  return a/n;
}
function monthSummary(k){
  var L=lastMonths(),proj={},o={k:k};
  /* tarjetas */
  if(L.LM&&k>L.LM){
    var off=mdiff(k,L.LM),cu=0;
    cardItems(L.LM).forEach(function(x){if(x.of&&x.n<x.of&&off<=x.of-x.n)cu+=x.mine});
    o.cardCu=cu;
    o.cardCorr=avgOf(function(m){return sumM(cardItems(m).filter(function(x){return !x.of}))},L.LM,3);
    proj.card=1;
  }else{
    var ci=cardItems(k);
    o.cardCu=sumM(ci.filter(function(x){return x.of}));
    o.cardPaid=ci.reduce(function(a,x){return a+x.t.amt},0);
    o.cardCorr=sumM(ci.filter(function(x){return !x.of}));
  }
  o.card=o.cardCu+o.cardCorr;
  /* cuenta */
  if(L.LC&&k>L.LC){o.cuenta=avgOf(function(m){return sumM(cuentaItems(m))},L.LC,3,true);proj.cuenta=1}
  else o.cuenta=sumM(cuentaItems(k));
  /* vida diaria */
  if(H.ready&&L.LH&&k>L.LH){o.vida=avgOf(function(m){return sumM(hogarDetail(m))},L.LH,3,true);proj.vida=1}
  else o.vida=sumM(hogarDetail(k));
  o.puntual=plannedFor(k).filter(function(p){return !p.auto}).reduce(function(a,p){return a+p.amt},0);
  o.rentTotal=planAmt(cfg.rentPlan,k)||0;o.rentShare=rentShare();o.rent=o.rentTotal*o.rentShare/100;
  o.inc=planAmt(cfg.incPlan,k)||0;
  o.rentRaise=planRaise(cfg.rentPlan,k);
  o.incRaise=planRaise(cfg.incPlan,k);
  o.total=o.rent+o.card+o.cuenta+o.vida+o.puntual;
  o.sobra=o.inc-o.total;
  o.proj=proj;o.isProj=!!(proj.card||proj.cuenta||proj.vida);
  o.hasData=!!((months[k]||[]).length||(H.ready&&(H.items[k]||[]).length));
  return o;
}
function pct(a,b){return b?Math.round(100*a/b)+'%':'—'}

/* --- gráfico de barras apiladas --- */
var SEG=[['rent','Alquiler','var(--c1)'],['card','Tarjetas','var(--c2)'],['vida','Vida diaria','var(--c3)'],['cuenta','Cuenta','var(--c4)'],['puntual','Puntuales','var(--c5)']];
function stackChart(list,goTab){
  var mx=1;list.forEach(function(s){mx=Math.max(mx,s.total,s.inc)});
  var h='<div class="chart">'+list.map(function(s){
    var segs=SEG.map(function(g){var v=s[g[0]];return v>0?'<div class="seg" style="height:'+(v/mx*100)+'%;background:'+g[2]+'" title="'+g[1]+': '+money(v)+'"></div>':''}).join('');
    return'<div class="col'+(s.k===ui.month?' cur':'')+(s.isProj?' pj':'')+'" data-month="'+s.k+'"><div class="bw">'+(s.inc>0?'<div class="incl" style="bottom:'+(s.inc/mx*100)+'%" title="Ingreso: '+money(s.inc)+'"></div>':'')+'<div class="stack">'+segs+'</div></div><div class="lb">'+mshort(s.k)+'</div></div>';
  }).join('')+'</div><div class="legend">'+SEG.map(function(g){return'<span><i style="background:'+g[2]+'"></i>'+g[1]+'</span>'}).join('')+'<span><i class="dash"></i>Ingreso</span><span class="note">Más claro = estimado</span></div>';
  return h;
}
function bindChart(v,tab){
  v.querySelectorAll('[data-month]').forEach(function(c){c.addEventListener('click',function(){ui.month=c.dataset.month;render()})});
}
function cuotasDelMes(k){
  var L=lastMonths(),out=[];
  if(L.LM&&k>L.LM){var off=mdiff(k,L.LM);cardItems(L.LM).forEach(function(x){if(x.of&&x.n<x.of&&off<=x.of-x.n)out.push({name:x.t.desc.replace(CU_RE,'').trim(),n:x.n+off,of:x.of,mine:x.mine})})}
  else cardItems(k).forEach(function(x){if(x.of)out.push({name:x.t.desc.replace(CU_RE,'').trim(),n:x.n,of:x.of,mine:x.mine})});
  return out.sort(function(a,b){return b.mine-a.mine});
}
function unfinished(k){return k===curMonth()?'<span class="chip">mes en curso</span>':''}

/* ---------- MES ---------- */

  var gen=(months[k]||[]).filter(function(t){return t.cat==='General'&&EXCL_NOSPEND.indexOf(t.cat)<0});

/* ---------- VIDA DIARIA (Splitwise) ---------- */
function hogarBalParts(k){
  var r={vida:0,card:0};
  Object.keys(H.items).forEach(function(m){
    if(k&&m!==k)return;
    H.items[m].forEach(function(it){
      if(it.type==='pago'){r.vida+=it.payer===H.uid?it.amt:-it.amt;return}
      var g=(it.ref&&it.ref!=='splitwise')?'card':'vida',oth=it.amt*(100-it.share)/100;
      r[g]+=it.payer===H.uid?oth:-oth;
    });
  });
  r.n=r.vida+r.card;return r;
}

/* ---------- AHORRO ---------- */
function savOf(k,tipo){return (cfg.ahorro||[]).filter(function(a){return a.m===k&&a.tipo===tipo}).reduce(function(s,a){return s+a.usd},0)}
function goalOf(y){
  y=String(y);
  if(cfg.goals&&cfg.goals[y]&&cfg.goals[y].usd!=null)return cfg.goals[y].usd;
  return y===String(now.getFullYear())?(cfg.goalUSD||0):0;
}
function planExp(y,m){var g=cfg.goals&&cfg.goals[y];return g&&g.plan&&g.plan[m]!=null?g.plan[m]:null}
function planOf(y,m){
  var x=planExp(y,m);if(x!=null)return x;
  var g=goalOf(y);if(!g)return 0;
  var ex=0,u=0;for(var i=1;i<=12;i++){var mm=y+'-'+String(i).padStart(2,'0'),e2=planExp(y,mm);if(e2!=null)ex+=e2;else u++}
  return u?Math.max(0,g-ex)/u:0;
}
function G(y){y=String(y);if(!cfg.goals)cfg.goals={};if(!cfg.goals[y])cfg.goals[y]={usd:goalOf(y),plan:{}};if(!cfg.goals[y].plan)cfg.goals[y].plan={};return cfg.goals[y]}
function yearSaved(y,tipo){return (cfg.ahorro||[]).filter(function(a){return a.tipo===tipo&&a.m.slice(0,4)===String(y)}).reduce(function(s,a){return s+a.usd},0)}
function vAhorro(){
  var v=$('#view'),yr=ui.ay||ui.month.slice(0,4),fx=cfg.fx||0,A=cfg.ahorro||[],goal=goalOf(yr);
  var yS=yearSaved(yr,'ahorro'),yU=yearSaved(yr,'uso'),
      allS=A.filter(function(a){return a.tipo==='ahorro'}).reduce(function(s,a){return s+a.usd},0),
      allU=A.filter(function(a){return a.tipo==='uso'}).reduce(function(s,a){return s+a.usd},0);
  var h='<div class="row yearnav"><button id="yprev">‹</button><strong style="font-size:20px">'+yr+'</strong><button id="ynext">›</button><span class="note">Objetivo y registro por año</span></div>';
  h+='<div class="kpis">'+
   '<div class="kpi"><div class="l">Objetivo '+yr+'</div><div class="v"><input data-goal="1" inputmode="decimal" class="bigin" value="'+(goal||'')+'" placeholder="USD"></div><div class="s">'+(goal?usd(goal/12)+' por mes en promedio':'Poné cuánto querés ahorrar este año')+'</div></div>'+
   '<div class="kpi"><div class="l">Ahorrado en '+yr+'</div><div class="v">'+usd(yS)+'</div><div class="s">'+(goal?pct(yS,goal)+' del objetivo · faltan '+usd(Math.max(0,goal-yS)):'—')+'</div></div>'+
   '<div class="kpi"><div class="l">Gastado del ahorro en '+yr+'</div><div class="v">'+usd(yU)+'</div><div class="s">Neto del año: '+usd(yS-yU)+'</div></div>'+
   '<div class="kpi"><div class="l">Ahorro disponible hoy</div><div class="v '+(allS-allU>=0?'good':'badc')+'">'+usd(allS-allU)+'</div><div class="s">Todos los años'+(fx?' · '+money((allS-allU)*fx):'')+'</div></div></div>';
  if(goal)h+='<div class="card"><div class="prog"><i style="width:'+Math.min(100,yS/goal*100)+'%"></i></div></div>';
  /* plan mes a mes */
  var bal=0,pbal=0,rows=[],planSum=0;
  for(var i=1;i<=12;i++){
    var m=yr+'-'+String(i).padStart(2,'0'),s=savOf(m,'ahorro'),u=savOf(m,'uso'),pl=planOf(yr,m),ex=planExp(yr,m);
    bal+=s-u;pbal+=pl;planSum+=pl;
    var det=(months[m]||[]).filter(function(t){return t.cat==='Ahorro'}).reduce(function(a,t){return a+t.amt},0);
    rows.push({m:m,s:s,u:u,pl:pl,ex:ex,b:bal,pb:pbal,det:det,sum:monthSummary(m)});
  }
  h+='<div class="card"><h2>Cuánto ahorrar mes a mes — '+yr+'</h2><div class="row"><button id="peven">Repartir parejo</button><button id="pfix">Recalcular lo que falta</button><span class="note">Plan: '+usd(planSum)+(goal?' de '+usd(goal)+(Math.abs(planSum-goal)>1?' <b class="badc">no coincide con el objetivo</b>':' ✓'):'')+'</span></div>'+
   '<div class="scroll"><table class="mt"><tr><th>Mes</th><th class="n">Debería ahorrar</th><th class="n">Ahorré</th><th class="n">Gasté del ahorro</th><th class="n">Diferencia</th><th class="n">Acumulado</th><th class="n">Según plan</th></tr>'+rows.map(function(r){
    var past=r.m<=curMonth(),df=r.s-r.pl;
    return'<tr class="'+(r.m===ui.month?'cur':'')+'"><td>'+e(mshort(r.m))+(r.det?'<div class="note">en cuenta: '+money(r.det)+' a ahorro</div>':'')+(r.sum.inc?'<div class="note">podría: '+(fx?usd(r.sum.sobra/fx):money(r.sum.sobra))+(r.sum.isProj?' (est.)':'')+'</div>':'')+'</td>'+
     '<td class="n"><input class="pin" data-m="'+r.m+'" inputmode="decimal" size="6" value="'+(r.ex!=null?r.ex:'')+'" placeholder="'+(Math.round(r.pl*100)/100)+'"></td>'+
     '<td class="n">'+(r.s?usd(r.s):'—')+'</td><td class="n">'+(r.u?usd(r.u):'—')+'</td>'+
     '<td class="n '+(past&&r.pl?(df>=0?'good':'badc'):'note')+'">'+(past&&r.pl?(df>=0?'+':'')+usd(df):'—')+'</td>'+
     '<td class="n"><b>'+usd(r.b)+'</b></td><td class="n note">'+usd(r.pb)+'</td></tr>'}).join('')+'</table></div><p class="note">Dejá el casillero vacío para usar el reparto parejo. Poné un valor para marcar meses de más (aguinaldo, un ingreso extra) o de menos. «Acumulado» es lo ahorrado menos lo gastado del ahorro, arrancando de cero cada año.</p></div>';
  h+='<div class="card"><h2>Anotar</h2><div class="grid2"><div><h3 style="margin-top:0">Ahorré</h3><div class="row"><input type="month" id="sm" value="'+(ui.month.slice(0,4)===yr?ui.month:yr+'-01')+'"><input id="su" inputmode="decimal" placeholder="USD" size="8"><input id="sn" placeholder="Nota (ej. compra de dólares)"><button class="pri" id="sadd">Registrar</button></div></div>'+
   '<div><h3 style="margin-top:0">Gasté del ahorro</h3><div class="row"><input type="month" id="um" value="'+(ui.month.slice(0,4)===yr?ui.month:yr+'-01')+'"><input id="uu" inputmode="decimal" placeholder="USD" size="8"><input id="un" placeholder="En qué (ej. cerco)"><button id="uadd">Registrar</button></div></div></div></div>';
  var list=A.filter(function(a){return a.m.slice(0,4)===yr}).sort(function(a,b){return a.m<b.m?1:a.m>b.m?-1:0});
  h+='<div class="card"><h2>Registro de '+yr+'</h2>'+(list.length?'<table>'+list.map(function(a){return'<tr><td>'+e(mshort(a.m))+'</td><td>'+(a.tipo==='ahorro'?'<span class="chip ok">ahorré</span>':'<span class="chip bad">gasté</span>')+' '+e(a.note||'')+'</td><td class="n">'+usd(a.usd)+'</td><td><button class="x sdel" data-id="'+e(a.id)+'">×</button></td></tr>'}).join('')+'</table>':'<p class="note">Todavía no anotaste nada este año.</p>')+'</div>';
  /* resumen por año */
  var ys={};ys[String(now.getFullYear())]=1;ys[String(now.getFullYear()+1)]=1;ys[yr]=1;
  A.forEach(function(a){ys[a.m.slice(0,4)]=1});Object.keys(cfg.goals||{}).forEach(function(y){ys[y]=1});
  h+='<div class="card"><h2>Año por año</h2><table><tr><th>Año</th><th class="n">Objetivo</th><th class="n">Ahorrado</th><th class="n">Avance</th><th class="n">Gastado</th><th class="n">Neto</th></tr>'+Object.keys(ys).sort().map(function(y){var g=goalOf(y),s=yearSaved(y,'ahorro'),u=yearSaved(y,'uso');return'<tr class="lk'+(y===yr?' cur':'')+'" data-year="'+y+'"><td><b>'+y+'</b></td><td class="n">'+(g?usd(g):'—')+'</td><td class="n">'+usd(s)+'</td><td class="n">'+(g?pct(s,g):'—')+'</td><td class="n">'+(u?usd(u):'—')+'</td><td class="n">'+usd(s-u)+'</td></tr>'}).join('')+'</table></div>';
  /* ingreso necesario */
  var nm=[];for(var j=0;j<12;j++)nm.push(monthSummary(shiftMonth(curMonth(),j)));
  var avgT=nm.reduce(function(a,x){return a+x.total},0)/12,avgI=nm.reduce(function(a,x){return a+x.inc},0)/12;
  h+='<div class="card"><h2>Cuánto necesitás ganar</h2><div class="grid2">'+
   '<label class="f">Dólar de referencia (ARS por USD)<input data-c="fx" inputmode="decimal" value="'+(cfg.fx||'')+'"></label>'+
   '<label class="f">Querés ahorrar de más por mes (USD)<input data-c="extraUSD" inputmode="decimal" value="'+(cfg.extraUSD||'')+'" placeholder="0"></label></div>';
  if(fx&&goal){
    var gm=goal/12+(cfg.extraUSD||0),need=avgT+gm*fx;
    h+='<table class="calc" style="margin-top:10px"><tr><td>Gasto mensual proyectado (promedio próximos 12 meses)</td><td class="n">'+money(avgT)+'</td></tr><tr><td>Ahorro mensual que buscás ('+usd(gm)+')</td><td class="n">'+money(gm*fx)+'</td></tr><tr class="t"><td>Ingreso neto necesario</td><td class="n">'+money(need)+'</td></tr><tr><td>Tu ingreso planeado (promedio)</td><td class="n">'+(avgI?money(avgI):'—')+'</td></tr>'+(avgI?'<tr class="t"><td>Diferencia</td><td class="n '+(avgI>=need?'good':'badc')+'">'+money(avgI-need)+'</td></tr>':'')+'</table><p class="note">Usa el objetivo de '+yr+', los aumentos que cargaste y las cuotas ya financiadas. Dólar fijo, sin inflación.</p>';
  }else h+='<p class="note">Poné el objetivo del año y el dólar para calcular el ingreso necesario.</p>';
  h+='</div>';
  v.innerHTML=h;bindChart(v);
  $('#yprev').addEventListener('click',function(){ui.ay=String(+yr-1);vAhorro()});
  $('#ynext').addEventListener('click',function(){ui.ay=String(+yr+1);vAhorro()});
  v.querySelectorAll('[data-year]').forEach(function(r){r.addEventListener('click',function(){ui.ay=r.dataset.year;vAhorro()})});
  v.querySelector('[data-goal]').addEventListener('change',function(){G(yr).usd=parseNum(this.value)||0;if(yr===String(now.getFullYear()))cfg.goalUSD=G(yr).usd;save('cfg');vAhorro()});
  v.querySelectorAll('[data-c]').forEach(function(i){i.addEventListener('change',function(){cfg[this.dataset.c]=parseNum(this.value)||0;save('cfg');vAhorro()})});
  v.querySelectorAll('.pin').forEach(function(i){i.addEventListener('change',function(){
    var g=G(yr),p=parseNum(this.value);
    if(this.value.trim()===''||p==null)delete g.plan[this.dataset.m];else g.plan[this.dataset.m]=Math.max(0,p);
    save('cfg');vAhorro();
  })});
  $('#peven').addEventListener('click',function(){G(yr).plan={};save('cfg');vAhorro()});
  $('#pfix').addEventListener('click',function(){
    if(!goal){toast('Primero poné el objetivo del año');return}
    var start=yr<String(curMonth()).slice(0,4)?null:(yr===curMonth().slice(0,4)?curMonth():yr+'-01');
    if(!start){toast('Ese año ya pasó');return}
    var done=0,left=[];
    for(var i=1;i<=12;i++){var m=yr+'-'+String(i).padStart(2,'0');if(m<start)done+=savOf(m,'ahorro');else left.push(m)}
    var each=Math.round(Math.max(0,goal-done)/left.length*100)/100,g=G(yr);
    for(var i2=1;i2<=12;i2++){var m2=yr+'-'+String(i2).padStart(2,'0');if(m2<start)g.plan[m2]=savOf(m2,'ahorro')}
    left.forEach(function(m){g.plan[m]=each});save('cfg');toast('Cada mes que queda: '+usd(each));vAhorro();
  });
  function add(tipo,mid,uid_,nid){
    var m=$(mid).value,a=parseNum($(uid_).value);
    if(!m||!a||a<=0){toast('Poné mes e importe en USD');return}
    if(!cfg.ahorro)cfg.ahorro=[];
    cfg.ahorro.push({id:uid(),m:m,tipo:tipo,usd:a,note:$(nid).value.trim()});save('cfg');ui.ay=m.slice(0,4);vAhorro();
  }
  $('#sadd').addEventListener('click',function(){add('ahorro','#sm','#su','#sn')});
  $('#uadd').addEventListener('click',function(){add('uso','#um','#uu','#un')});
  v.querySelectorAll('.sdel').forEach(function(b){b.addEventListener('click',function(){cfg.ahorro=cfg.ahorro.filter(function(a){return a.id!==b.dataset.id});save('cfg');vAhorro()})});
}

   '</div>'+
   '<div class="row"><span class="note">Agregar a mano:</span><input id="mdate" type="date" value="'+ui.month+'-01"><input id="mdesc" placeholder="Descripción"><input id="mamt" inputmode="decimal" placeholder="Importe" size="10"><select id="mcat">'+cats.map(function(c){return'<option>'+e(c)+'</option>'}).join('')+'</select><button id="madd">Agregar</button></div>'+

function listMov(){
  var f=ui.f,list=(months[ui.month]||[]).filter(function(t){
    if(f.src&&t.src!==f.src)return false;
    if(f.cat&&t.cat!==f.cat)return false;
    if(f.q&&norm(t.desc+' '+(t.note||'')).indexOf(norm(f.q))<0)return false;
    return true;
  });
  var tot=list.filter(function(t){return EXCL_NOSPEND.indexOf(t.cat)<0}).reduce(function(a,t){return a+t.amt},0);

  h+='<table><tr><th>Fecha</th><th>Descripción y detalle</th><th class="n">Importe</th><th>Categoría</th><th></th></tr>';

    var dd=t.od||t.d;
    h+='<tr data-id="'+e(t.id)+'"><td'+(t.od?' title="Resumen del '+e(t.d)+'"':'')+'>'+e(dd.slice(8)+'/'+dd.slice(5,7))+'</td>'+
     '<td>'+e(t.desc)+'<span class="chip">'+e(t.src)+'</span><br><input class="note-in" placeholder="¿Qué fue? (detalle propio)" value="'+e(t.note||'')+'" style="width:100%;margin-top:3px;font-size:13px">'+
     '<div class="note" style="margin-top:3px"><label><input type="checkbox" class="sh-on"'+(t.sh!=null&&t.sh<100?' checked':'')+((H.ready&&t.amt>0)?'':' disabled')+'> Compartido con el hogar</label>'+(t.sh!=null&&t.sh<100?' · mi parte <input class="sh-pct" size="3" value="'+t.sh+'">%':'')+'</div></td>'+
     '<td class="n'+(t.amt<0?' neg':'')+'">'+money(t.amt)+'</td>'+
     '<td><select class="cat-in'+(t.sug?' sug':'')+'">'+cfg.cats.map(function(c){return'<option'+(c===t.cat?' selected':'')+'>'+e(c)+'</option>'}).join('')+'</select></td>'+
     '<td><button class="x del" title="Eliminar">×</button></td></tr>';
  });
  if(!H.ready)h+='<tr><td colspan="5" class="note">Para marcar gastos como compartidos, primero activá el hogar en la pestaña Hogar.</td></tr>';
  h+='</table>'+(list.length>500?'<p class="note">Mostrando los primeros 500. Filtrá para ver el resto.</p>':'');
  $('#mlist').innerHTML=h;

function generalGroups(){
  var g={};
  cfg.months.forEach(function(m){(months[m]||[]).forEach(function(t){
    if(t.cat!=='General'||t.manual)return;
    var k=descKey(t.desc);if(k.length<4)k=nk(t.desc);
    var o=g[k]||(g[k]={k:k,n:0,sum:0,ex:t.desc});o.n++;o.sum+=t.amt;
  })});
  return Object.keys(g).map(function(k){return g[k]}).sort(function(a,b){return Math.abs(b.sum)-Math.abs(a.sum)});
}
function groupsHtml(){
  var gs=generalGroups().slice(0,40);if(!gs.length)return '';
  return '<div class="card" style="background:var(--acc2)"><h3 style="margin-top:0">Clasificar por comercio (todos los meses): elegí una categoría y se aplica a todos los parecidos</h3><table>'+
   gs.map(function(g){return'<tr><td>'+e(g.ex)+'</td><td class="n note">'+g.n+'×</td><td class="n">'+money(g.sum)+'</td><td><select class="grp-cat" data-k="'+e(g.k)+'"><option>General</option>'+cfg.cats.filter(function(c){return c!=='General'}).map(function(c){return'<option>'+e(c)+'</option>'}).join('')+'</select></td></tr>'}).join('')+
   '</table><p class="note">Muestro los 40 más pesados. Si no sabés qué fue una transferencia, dejala en General y anotá el detalle en cada movimiento.</p></div>';
}
function applyGroup(k,cat){
  if(cat==='General')return;
  if(!cfg.rules.some(function(x){return nk(x.k)===nk(k)})){cfg.rules.unshift({k:k,c:cat});save('cfg')}
  var n=0;
  cfg.months.forEach(function(m){var ch=false;(months[m]||[]).forEach(function(t){
    if(t.cat==='General'&&!t.manual&&(descKey(t.desc).length>=4?descKey(t.desc):nk(t.desc))===k){t.cat=cat;n++;ch=true}
  });if(ch)save(m)});
  toast(n+' movimientos pasaron a «'+cat+'» y quedó una regla para los próximos');listMov();
}
function findTx(id){var k=ui.month;var a=months[k]||[];for(var i=0;i<a.length;i++)if(a[i].id===id)return{k:k,i:i,t:a[i]};return null}
document.addEventListener('change',function(ev){
  if(ev.target.classList&&ev.target.classList.contains('grp-cat')){applyGroup(ev.target.dataset.k,ev.target.value);return}
  var tr=ev.target.closest('tr[data-id]');if(!tr||ui.tab!=='mov')return;
  var r=findTx(tr.dataset.id);if(!r)return;
  if(ev.target.classList.contains('sh-on')){

function addTx(list){
  var changed={},added=0,dup=0;
  list.forEach(function(t){
    var k=t.d.slice(0,7);if(!months[k])months[k]=[];
    if(cfg.months.indexOf(k)<0){cfg.months.push(k);cfg.months.sort();changed.cfg=true}
    if(months[k].some(function(x){return x.id===t.id})){dup++;return}
    months[k].push(t);changed[k]=true;added++;

  Object.keys(changed).forEach(function(k){if(k!=='cfg')months[k].sort(function(a,b){return a.d<b.d?-1:a.d>b.d?1:0})});
  Object.keys(changed).forEach(function(k){save(k==='cfg'?'cfg':k)});

}

async function handleFile(f){

    }else throw new Error('Formato no soportado: .'+ext);

async function pdfToText(buf){
  var lib=window.pdfjsLib;lib.GlobalWorkerOptions.workerSrc=URL_PDFW;
  var doc=await lib.getDocument({data:new Uint8Array(buf)}).promise,out=[];
  for(var p=1;p<=doc.numPages;p++){
    var tc=await(await doc.getPage(p)).getTextContent();
    var items=tc.items.filter(function(i){return i.str.trim()}).map(function(i){return{s:i.str,x:i.transform[4],y:i.transform[5]}});
    items.sort(function(a,b){return b.y-a.y});
    var lines=[];
    items.forEach(function(it){var L=lines[lines.length-1];if(L&&Math.abs(L.y-it.y)<=3)L.it.push(it);else lines.push({y:it.y,it:[it]})});
    lines.forEach(function(L){L.it.sort(function(a,b){return a.x-b.x});out.push(L.it.map(function(i){return i.s}).join('  '))});
  }
  return out.join('\n');
}

  var find=function(re){return head.findIndex(function(c){return re.test(c)})};
  var m={hdr:hdr,date:find(/fecha|date/i),desc:find(/descrip|concepto|detalle|comercio|movimiento|referencia|establecimiento/i),amt:find(/importe|monto|pesos|amount/i),deb:find(/d[eé]bito|debe/i),cred:find(/cr[eé]dito|haber/i),head:head,mode:ui.imp.src==='cuenta'?'neg':'pos'};

function cleanDesc(s){

  var bad=/^(\d[\d\s.*xX-]*|nro\.? ?operaci.*|varios|pago con transf\.?|spre|banco .*|reintegros? os y prepagas|[0-9xX]{10,}.*)$/i;
  var keep=lines.filter(function(l){return !bad.test(l)}).map(function(l){return l.replace(/\b\d{8,}\b/g,'').replace(/\s+/g,' ').trim()}).filter(function(l){return l.length>2});
  var out=keep.slice(0,2);
  if(keep[2]&&/^[A-ZÁÉÍÓÚÑ]{4,}$/.test(keep[2]))out.push(keep[2]);
  return (out.length?out:lines.slice(0,2)).join(' · ');
}

var MES_N={enero:1,febrero:2,marzo:3,abril:4,mayo:5,junio:6,julio:7,agosto:8,septiembre:9,octubre:10,noviembre:11,diciembre:12};
function cuotasAVencer(text){
  var lines=String(text).split(/\r?\n/);
  for(var i=0;i<lines.length;i++){
    var ms=lines[i].match(/(Enero|Febrero|Marzo|Abril|Mayo|Junio|Julio|Agosto|Septiembre|Octubre|Noviembre|Diciembre)\s*\/\s*\d{2}/gi);
    if(!ms||ms.length<3)continue;
    for(var j=i+1;j<Math.min(i+10,lines.length);j++){
      var am=lines[j].match(/\$\s?[\d.]+,\d{2}/g);
      if(am&&am.length>=ms.length){
        var out=[];
        ms.forEach(function(mm,x){
          var p=mm.split('/'),mo=MES_N[p[0].trim().toLowerCase()],y=2000+parseInt(p[1],10),v=parseNum(am[x]);
          if(mo&&v>0)out.push({k:y+'-'+String(mo).padStart(2,'0'),amt:v});

  }
  return [];
}
function textToRaw(text,src,cierre){

  var amtRe=/-?\$?\s?\d{1,3}(?:\.\d{3})*,\d{2}-?|-?\$?\s?\d+,\d{2}-?/g;

    var rest=m[2],am=rest.match(amtRe);if(!am)return;
    var tok=(src==='cuenta'&&am.length>=2)?am[am.length-2]:am[am.length-1];
    var val=parseNum(tok);if(val==null)return;

    if(desc.length<2)return;

  var v=$('#view');
  v.innerHTML='<div class="card"><h2>Reglas de categorización</h2><p class="note">Si la descripción contiene el texto, se asigna la categoría. Se prueban de arriba hacia abajo; las que creás clasificando a mano quedan arriba.</p>'+
   '<div class="row"><input id="rk" placeholder="Texto (ej. FARMACITY)"><select id="rc">'+cfg.cats.map(function(c){return'<option>'+e(c)+'</option>'}).join('')+'</select><button id="radd">Agregar regla</button><button id="rapply">Reaplicar a «General»</button></div>'+
   '<div id="rlist" style="max-height:340px;overflow:auto"></div></div>'+
   '<div class="card"><h2>Categorías</h2><div class="row"><input id="ck" placeholder="Nueva categoría"><button id="cadd">Agregar</button></div><p class="note">'+cfg.cats.map(e).join(' · ')+'</p></div>'+
   '<div class="card"><h2>Copia de seguridad</h2><p class="note">Tus datos viven en tu base de Supabase. Igual, bajá una copia de vez en cuando: el plan gratuito no hace copias automáticas.</p><div class="row"><button id="bjson">Descargar respaldo (.json)</button><button id="bcsv">Descargar movimientos (.csv)</button><label class="note">Restaurar desde archivo: <input type="file" id="bfile" accept=".json"></label></div></div>';
  rlist();
  $('#radd').addEventListener('click',function(){var k=$('#rk').value.trim();if(!k)return;cfg.rules.unshift({k:k.toUpperCase(),c:$('#rc').value});save('cfg');$('#rk').value='';rlist()});
  $('#rapply').addEventListener('click',function(){var n=0;cfg.months.forEach(function(m){var ch=false;(months[m]||[]).forEach(function(t){if(t.cat==='General'&&!t.manual){var c=categorize(t.desc,t.amt,t.src);if(c!=='General'){t.cat=c;n++;ch=true}}});if(ch)save(m)});toast(n+' movimientos reclasificados')});
  $('#rlist').addEventListener('click',function(ev){var b=ev.target.closest('.rdel');if(!b)return;cfg.rules.splice(+b.dataset.i,1);save('cfg');rlist()});
  $('#cadd').addEventListener('click',function(){var c=$('#ck').value.trim();if(c&&cfg.cats.indexOf(c)<0){cfg.cats.splice(cfg.cats.indexOf('General'),0,c);save('cfg');vCfg()}});
  $('#bjson').addEventListener('click',exportBackup);
  $('#bcsv').addEventListener('click',exportCSV);
  $('#bfile').addEventListener('change',function(){
    var f=this.files[0];if(!f)return;var r=new FileReader();
    r.onload=function(){try{var n=importBackup(String(r.result));toast('Respaldo cargado: '+n+' movimientos nuevos');render()}catch(err){toast(err&&err.message?err.message:'Archivo inválido')}};
    r.readAsText(f);
  });
}
function rlist(){
  $('#rlist').innerHTML='<table>'+cfg.rules.map(function(r,i){return'<tr><td>'+e(r.k)+'</td><td>'+e(r.c)+'</td><td><button class="x rdel" data-i="'+i+'">×</button></td></tr>'}).join('')+'</table>';
}

/* ---------- Hogar (gastos en pareja) ---------- */
var H={ready:false,hid:null,uid:null,name:'',code:'',members:{},items:{},synced:{},t:0};
function hogarOther(){var ids=Object.keys(H.members).filter(function(u){return u!==H.uid});return ids.length?ids[0]:null}
function nameOf(u){return u===H.uid?'Vos':(H.members[u]||'La otra persona')}
function itemRow(it){return{hogar_id:H.hid,payer:H.uid,id:it.id,fecha:it.d,descripcion:it.desc,importe:it.amt,categoria:it.cat||null,nota:it.note||null,share:it.share==null?50:it.share,tipo:it.type||'gasto',ref:it.ref||null}}
function rowItem(r){var it={id:r.id,d:r.fecha,desc:r.descripcion,amt:Number(r.importe),share:Number(r.share),type:r.tipo,payer:r.payer};if(r.categoria)it.cat=r.categoria;if(r.nota)it.note=r.nota;if(r.ref)it.ref=r.ref;return it}
async function hogarLoad(){
  var mm=await sb.from('hogar_miembros').select('hogar_id,user_id,nombre');
  if(mm.error)throw mm.error;
  if(!mm.data.length){H.ready=false;H.members={};H.items={};return}
  H.hid=mm.data[0].hogar_id;H.uid=S.uid;H.members={};
  mm.data.forEach(function(r){H.members[r.user_id]=r.nombre});
  H.name=H.members[S.uid]||'';
  var hg=await sb.from('hogares').select('codigo').eq('id',H.hid).maybeSingle();
  H.code=(hg.data&&hg.data.codigo)||'';
  var items={},synced={};
  for(var from=0;;from+=1000){
    var r=await sb.from('hogar_items').select('*').eq('hogar_id',H.hid).order('fecha',{ascending:true}).range(from,from+999);
    if(r.error)throw r.error;
    r.data.forEach(function(x){var it=rowItem(x),k=it.d.slice(0,7);(items[k]=items[k]||[]).push(it);if(it.payer===S.uid)synced[it.id]={k:k,j:JSON.stringify(itemRow(it))}});
    if(r.data.length<1000)break;
  }
  H.items=items;H.synced=synced;H.ready=true;H.t=Date.now();
}
var hs={};
function hogarSave(k){
  clearTimeout(hs[k]);
  hs[k]=setTimeout(function(){q=q.then(function(){return hogarDoSave(k)}).catch(function(){})},350);
}
async function hogarDoSave(k){
  setBadge('Guardando…');
  try{
    var mine=(H.items[k]||[]).filter(function(p){return p.payer===H.uid}),up=[],seen={};
    mine.forEach(function(it){var row=itemRow(it),j=JSON.stringify(row);seen[it.id]=1;if(!H.synced[it.id]||H.synced[it.id].j!==j)up.push({row:row,j:j,id:it.id})});
    var del=Object.keys(H.synced).filter(function(id){return H.synced[id].k===k&&!seen[id]});
    if(up.length){
      var r=await sb.from('hogar_items').upsert(up.map(function(x){return x.row}),{onConflict:'hogar_id,payer,id'});
      if(r.error)throw r.error;
      up.forEach(function(x){H.synced[x.id]={k:k,j:x.j}});
    }
    if(del.length){
      var r2=await sb.from('hogar_items').delete().eq('hogar_id',H.hid).eq('payer',H.uid).in('id',del);
      if(r2.error)throw r2.error;
      del.forEach(function(id){delete H.synced[id]});
    }
    setBadge('Guardado ✓');
  }catch(err){setBadge('Error al guardar');toast('No pude guardar en el hogar: '+(err&&err.message?err.message:'error'))}
}
function hogarUpsert(item){
  var k=item.d.slice(0,7);item.payer=H.uid;
  var arr=H.items[k]||(H.items[k]=[]);
  var idx=arr.findIndex(function(x){return x.id===item.id&&x.payer===H.uid});
  if(idx>-1)arr[idx]=item;else arr.push(item);
  arr.sort(function(a,b){return a.d<b.d?-1:a.d>b.d?1:0});
  hogarSave(k);
}
function hogarRemove(id){
  Object.keys(H.items).forEach(function(k){
    var arr=H.items[k],i=arr.findIndex(function(x){return x.id===id&&x.payer===H.uid});
    if(i>-1){arr.splice(i,1);hogarSave(k)}
  });
}
function hogarFromTx(t){
  if(!H.ready||t.sh==null)return;
  if(t.sh>=100){hogarRemove('p-'+t.id);return}
  hogarUpsert({id:'p-'+t.id,d:t.d,desc:t.desc,amt:t.amt,cat:t.cat,note:t.note||'',share:t.sh,type:'gasto',ref:t.id});
}
function hogarExtras(k){
  if(!H.ready)return[];
  var out=[];
  (H.items[k]||[]).forEach(function(it){
    if(it.type==='pago'||EXCL_NOSPEND.indexOf(it.cat)>-1)return;
    if(it.payer===H.uid){if(!it.ref)out.push({cat:it.cat||'General',amt:it.amt*it.share/100})}
    else out.push({cat:it.cat||'General',amt:it.amt*(100-it.share)/100});
  });
  return out;
}
function hogarBal(k){
  var b={n:0,paidMe:0,paidO:0,consMe:0,consO:0,total:0};
  Object.keys(H.items).forEach(function(m){
    if(k&&m!==k)return;
    H.items[m].forEach(function(it){
      if(it.type==='pago'){if(it.payer===H.uid)b.n+=it.amt;else b.n-=it.amt;return}
      var oth=it.amt*(100-it.share)/100,own=it.amt*it.share/100;
      b.total+=it.amt;
      if(it.payer===H.uid){b.n+=oth;b.paidMe+=it.amt;b.consMe+=own;b.consO+=oth}
      else{b.n-=oth;b.paidO+=it.amt;b.consO+=own;b.consMe+=oth}
    });
  });
  return b;
}
function balHtml(n,on){
  if(n>0.5)return'<span class="big good">'+e(on)+' te debe '+money(n)+'</span><div class="note">Para igualarse, '+e(on)+' tiene que transferirte '+money(n)+'.</div>';
  if(n<-0.5)return'<span class="big badc">Le debés '+money(-n)+' a '+e(on)+'</span><div class="note">Para igualarse tenés que transferirle '+money(-n)+' a '+e(on)+'.</div>';
  return'<span class="big">Están a mano</span>';
}
async function hogarImport(file){
  var d=JSON.parse(await file.text());
  if(!d||d.kind!=='hogar-historial'||!Array.isArray(d.items))throw new Error('Ese archivo no es un historial de hogar');
  var n=0,ks={};
  d.items.forEach(function(x){
    if(!x.id||!/^\d{4}-\d{2}-\d{2}$/.test(x.d||'')||typeof x.amt!=='number')return;
    var it={id:String(x.id),d:x.d,desc:String(x.desc||''),amt:x.amt,share:x.share==null?50:x.share,type:x.type==='pago'?'pago':'gasto',payer:H.uid};
    if(x.cat)it.cat=x.cat;if(x.note)it.note=x.note;if(x.ref)it.ref=x.ref;
    var k=it.d.slice(0,7),arr=H.items[k]||(H.items[k]=[]);
    var i=arr.findIndex(function(y){return y.id===it.id&&y.payer===H.uid});
    if(i>-1)arr[i]=it;else arr.push(it);
    ks[k]=1;n++;
  });
  Object.keys(ks).forEach(function(k){H.items[k].sort(function(a,b){return a.d<b.d?-1:a.d>b.d?1:0});hogarSave(k)});
  return n;
}
function vHogar(){
  var v=$('#view');
  if(!H.ready){
    v.innerHTML='<div class="card"><h2>Gastos en pareja</h2>'+
     '<p>Cada uno carga lo que pagó, marca qué gastos son compartidos y la app calcula cuánto tiene que aportar el otro para igualarse.</p>'+
     '<p class="note">Tus movimientos personales no se comparten. Solo se ve lo que marques como «Compartido». Un hogar es de dos personas.</p>'+
     '<div class="grid2"><div class="card"><h3 style="margin-top:0">Creo yo el hogar</h3><label class="f">Tu nombre en el hogar<input id="hname1" placeholder="ej. Manuel"></label><div class="row" style="margin-top:10px"><button class="pri" id="hcreate">Crear hogar</button></div><p class="note">Te va a dar un código para pasarle a la otra persona.</p></div>'+
     '<div class="card"><h3 style="margin-top:0">Mi pareja ya lo creó</h3><label class="f">Tu nombre en el hogar<input id="hname2" placeholder="ej. Flor"></label><label class="f" style="margin-top:8px">Código del hogar<input id="hcode" autocomplete="off"></label><div class="row" style="margin-top:10px"><button id="hjoin">Unirme</button></div></div></div><p class="note" id="herr"></p></div>';
    $('#hcreate').addEventListener('click',async function(){
      var n=$('#hname1').value.trim();if(!n){$('#herr').textContent='Poné tu nombre.';return}
      $('#herr').textContent='Creando…';
      var r=await sb.rpc('crear_hogar',{p_nombre:n});
      if(r.error){$('#herr').textContent=r.error.message;return}
      try{await hogarLoad()}catch(err){$('#herr').textContent=err.message;return}
      toast('Hogar creado');render();
    });
    $('#hjoin').addEventListener('click',async function(){
      var n=$('#hname2').value.trim(),c=$('#hcode').value.trim();if(!n||!c){$('#herr').textContent='Poné tu nombre y el código.';return}
      $('#herr').textContent='Entrando…';
      var r=await sb.rpc('unirse_hogar',{p_codigo:c,p_nombre:n});
      if(r.error){$('#herr').textContent=r.error.message;return}
      try{await hogarLoad()}catch(err){$('#herr').textContent=err.message;return}
      toast('Ya estás en el hogar');render();
    });
    return;
  }
  if(Date.now()-H.t>20000){H.t=Date.now();hogarLoad().then(function(){if(ui.tab==='hogar')vHogar()}).catch(function(){})}
  var o=hogarOther(),on=o?H.members[o]:'La otra persona',tot=hogarBal(null),mb=hogarBal(ui.month);
  var h='<div class="card"><div class="row"><h2 style="margin:0;flex:1">Hogar: '+e(H.name)+(o?' y '+e(on):'')+'</h2><button id="hrefresh">Actualizar</button></div>'+
   (o?'':'<p class="alert">Todavía no entró la otra persona. Que cree su cuenta en esta misma página y elija «Unirme» con este código: <b>'+e(H.code)+'</b></p>')+
   '<h3>Saldo acumulado entre ustedes</h3>'+balHtml(tot.n,on)+
   '<div class="row" style="margin-top:10px"><span class="note">Registrar un pago que hiciste a '+e(on)+':</span><input id="gamt" inputmode="decimal" placeholder="Importe" size="10"><input id="gdate" type="date" value="'+new Date().toISOString().slice(0,10)+'"><button id="gadd"'+(o?'':' disabled')+'>Registrar pago</button></div></div>';
  h+='<div class="card"><h2>'+e(mlabel(ui.month))+'</h2><table class="calc">'+
   '<tr><td>Gastado en conjunto</td><td class="n">'+money(mb.total)+'</td></tr>'+
   '<tr><td>Pagó '+e(H.name)+'</td><td class="n">'+money(mb.paidMe)+'</td></tr>'+
   '<tr><td>Pagó '+e(on)+'</td><td class="n">'+money(mb.paidO)+'</td></tr>'+
   '<tr><td>Le corresponde a '+e(H.name)+' / a '+e(on)+'</td><td class="n">'+money(mb.consMe)+' / '+money(mb.consO)+'</td></tr>'+
   '<tr class="t"><td>Diferencia solo de este mes</td><td class="n">'+(Math.abs(mb.n)<0.5?'a mano':(mb.n>0?e(on)+' debe '+money(mb.n):'debés '+money(-mb.n))+' (sin contar pagos de meses anteriores)')+'</td></tr></table></div>';
  var list=(H.items[ui.month]||[]).slice().sort(function(a,b){return a.d<b.d?-1:a.d>b.d?1:0});
  h+='<div class="card"><h2>Movimientos del hogar</h2>';
  if(!list.length)h+='<p class="note">Nada cargado este mes. Marcá movimientos como «Compartido» en la pestaña Movimientos, o agregá uno acá abajo.</p>';
  else h+='<table><tr><th>Fecha</th><th>Detalle</th><th>Pagó</th><th class="n">Total</th><th>Reparto</th><th></th></tr>'+list.map(function(it){
    var own=it.payer===H.uid,oth=own?o:H.uid;
    if(it.type==='pago')return'<tr><td>'+e(it.d.slice(8)+'/'+it.d.slice(5,7))+'</td><td>'+e(it.desc)+'<span class="chip">pago</span></td><td>'+e(nameOf(it.payer))+'</td><td class="n">'+money(it.amt)+'</td><td></td><td>'+(own?'<button class="x hdel" data-id="'+e(it.id)+'">×</button>':'')+'</td></tr>';
    return'<tr data-id="'+e(it.id)+'"><td>'+e(it.d.slice(8)+'/'+it.d.slice(5,7))+'</td><td>'+e(it.desc)+'<span class="chip">'+e(it.cat||'General')+'</span>'+(it.note?'<div class="note">'+e(it.note)+'</div>':'')+'</td><td>'+e(nameOf(it.payer))+'</td><td class="n">'+money(it.amt)+'</td>'+
     '<td class="note">'+(own?'<input class="hsh" size="3" value="'+it.share+'">% mío':e(nameOf(it.payer))+' '+it.share+'% · '+e(nameOf(oth))+' '+(100-it.share)+'%')+'</td><td>'+(own?'<button class="x hdel" data-id="'+e(it.id)+'">×</button>':'')+'</td></tr>';
  }).join('')+'</table>';
  h+='<p class="note">Cada uno puede editar o borrar solo lo que pagó él.</p></div>';
  h+='<div class="card"><h2>Agregar un gasto compartido que pagaste vos</h2><div class="row"><input id="hdt" type="date" value="'+ui.month+'-01"><input id="hds" placeholder="Descripción"><input id="hmt" inputmode="decimal" placeholder="Total pagado" size="10"><select id="hct">'+cfg.cats.filter(function(c){return EXCL_NOSPEND.indexOf(c)<0}).map(function(c){return'<option>'+e(c)+'</option>'}).join('')+'</select><label class="note">mi parte <input id="hpc" size="3" value="50">%</label><button id="hadd" class="pri">Agregar</button></div><p class="note">Con 50% se reparte a mitades. Con 0% el gasto fue todo del otro (por ejemplo, le pagaste algo a '+e(on)+').</p></div>';
  h+='<div class="card"><h2>Importar historial</h2><p class="note">Cargá un archivo de historial (.json) con lo que pagaste vos. Se puede repetir sin duplicar. Cada uno importa el suyo.</p><div class="row"><input type="file" id="himp" accept=".json"></div></div>';
  v.innerHTML=h;
  $('#himp').addEventListener('change',function(){
    var f=this.files[0];if(!f)return;
    hogarImport(f).then(function(n){toast(n+' movimientos importados. Guardando…');vHogar()}).catch(function(err){toast(err&&err.message?err.message:'No pude leer el archivo')});
  });
  $('#hrefresh').addEventListener('click',function(){hogarLoad().then(function(){toast('Actualizado');vHogar()}).catch(function(){toast('No pude actualizar')})});
  $('#gadd').addEventListener('click',function(){
    var a=parseNum($('#gamt').value),d=$('#gdate').value;if(!a||a<=0||!d||!o){toast('Poné un importe y una fecha');return}
    hogarUpsert({id:'g-'+uid(),d:d,desc:'Pago de '+H.name+' a '+on,amt:a,type:'pago'});toast('Pago registrado');ui.month=d.slice(0,7);vHogar();
  });
  $('#hadd').addEventListener('click',function(){
    var d=$('#hdt').value,ds=$('#hds').value.trim(),a=parseNum($('#hmt').value),pc=parseNum($('#hpc').value);
    if(!d||!ds||!a||a<=0||pc==null||pc<0||pc>100){toast('Revisá fecha, descripción, importe y porcentaje (0 a 100)');return}
    hogarUpsert({id:'h-'+uid(),d:d,desc:ds,amt:a,cat:$('#hct').value,share:pc,type:'gasto'});ui.month=d.slice(0,7);vHogar();
  });
  v.querySelectorAll('.hdel').forEach(function(b){b.addEventListener('click',function(){hogarRemove(b.dataset.id);vHogar()})});
  v.querySelectorAll('.hsh').forEach(function(i){i.addEventListener('change',function(){
    var id=i.closest('tr').dataset.id,pc=parseNum(i.value);
    if(pc==null||pc<0||pc>100){toast('El porcentaje va de 0 a 100');return}
    var arr=H.items[ui.month]||[],it=arr.find(function(x){return x.id===id&&x.payer===H.uid});
    if(it){it.share=pc;hogarSave(ui.month);if(it.ref){var tt=(months[ui.month]||[]).find(function(x){return x.id===it.ref});if(tt){tt.sh=pc;save(ui.month)}}vHogar()}
  })});
}

/* ---------- arranque ---------- */
boot();
})();
</script>
